name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "scripts/release-*.mjs"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-admin-ui.yml"
      - ".github/workflows/release-mcp-ui.yml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只计算会发布什么，不打 tag、不提交待审
        type: boolean
        default: true

# 串行。取消正在进行的发布会留下已经推上去的 tag。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # semantic-release 用 GITHUB_TOKEN 自己推送。这个令牌打的 tag 不会再次触发工作流。
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version, tag, and dispatch the publish workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry-run == true || inputs.dry-run == 'true') && '1' || '' }}
        run: node scripts/release-package.mjs
