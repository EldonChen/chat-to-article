name: Release @liem-opc/chat-to-article-admin-ui

on:
  push:
    tags: ["admin-ui-v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every step but skip the actual npm upload
        type: boolean
        default: true

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_publish-package.yml
    with:
      package-dir: admin-ui
      tag-prefix: admin-ui-v
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
