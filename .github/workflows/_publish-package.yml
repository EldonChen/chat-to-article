name: Publish package (reusable)

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory under packages/, e.g. admin-ui
        required: true
        type: string
      tag-prefix:
        description: Git tag prefix that carries the version, e.g. admin-ui-v
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check version against tag
        id: meta
        working-directory: packages/${{ inputs.package-dir }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected="${GITHUB_REF_NAME#${{ inputs.tag-prefix }}}"
            if [[ "$expected" != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $name@$version"
              exit 1
            fi
          fi
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::error::$name@$version is already on npm; bump the version first"
            exit 1
          fi

      - name: Typecheck, test, build
        run: |
          pnpm --filter "${{ steps.meta.outputs.name }}..." run typecheck
          pnpm --filter "${{ steps.meta.outputs.name }}..." run test
          pnpm --filter "${{ steps.meta.outputs.name }}" run build

      - name: Smoke-test the packed CLI
        working-directory: packages/${{ inputs.package-dir }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/*.tgz
          bin=$(node -p "Object.keys(require('${{ steps.meta.outputs.name }}/package.json').bin)[0]")
          npx "$bin" --help

      # 不设置 NODE_AUTH_TOKEN。静态令牌会让 npm 跳过 OIDC。
      # 运行器自带的 npm 10 不会用 GitHub OIDC 登录；stage publish 需要 npm 11.15.0 及以上。
      # 先用 pnpm pack：它会把 workspace: 协议改写成普通版本号。npm stage publish 不认识工作区。
      # 公开仓库上，OIDC 会自动附带 provenance。批准之前，这个版本不能被安装。
      - name: Stage on npm
        working-directory: packages/${{ inputs.package-dir }}
        run: |
          if [[ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]]; then
            echo "::error::作业没有 OIDC 令牌。检查工作流是否声明了 id-token: write。"
            exit 1
          fi
          npm install -g npm@11.15.0
          npm --version
          pack="$RUNNER_TEMP/stage-pack"
          mkdir -p "$pack"
          pnpm pack --pack-destination "$pack"
          args=(--registry https://registry.npmjs.org --access public --provenance)
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          npm stage publish "$pack"/*.tgz "${args[@]}"
          if [[ "${{ inputs.dry-run }}" != "true" ]]; then
            echo "::notice title=等待批准::${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} 已进入 npm 待审队列。打开包页面的 Staged Packages，核对后点 Approve。"
          fi
